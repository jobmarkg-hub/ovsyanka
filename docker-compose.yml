version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ovsyanka_postgres
    restart: always
    environment:
      POSTGRES_USER: ovsyanka
      POSTGRES_PASSWORD: ovsyankapassword
      POSTGRES_DB: ovsyanka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovsyanka"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ovsyanka_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: ovsyanka_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ovsyanka_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://ovsyanka:ovsyankapassword@postgres:5432/ovsyanka
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: ovsyanka-audio
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
